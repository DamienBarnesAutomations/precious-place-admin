server {
    listen 80;
    server_name localhost;

    location /orders/ {
        alias /usr/share/nginx/html/orders/;
        index index.html;
        try_files $uri $uri/ /orders/index.html;
    }

    # Optional: Handle static assets specifically if needed
    location /orders/assets/ {
        alias /usr/share/nginx/html/orders/assets/;
    }
}
