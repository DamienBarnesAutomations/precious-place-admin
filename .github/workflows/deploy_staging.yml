name: Deploy to Server

on:
  push:
    branches:
      - staging

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_PREFIX: ghcr.io/damienbarnesautomations/precious-place-admin

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse ENV_JSON into environment
        run: |
          echo '${{ secrets.ENV_JSON }}' \
            | jq -r 'to_entries | map("\(.key)=\(.value)") | .[]' \
            >> $GITHUB_ENV

      - name: Build and push POS Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./pos-frontend
          push: true
          tags: ${{ env.IMAGE_NAME_PREFIX }}/pos_frontend:staging
          build-args: |
            VITE_API_BASE_URL=${{ env.API_BASE_URL }}
            VITE_IMAGE_BASE_URL=${{ env.IMAGE_BASE_URL }}
            VITE_CURRENCY=$
            VITE_APP_TITLE=Precious Place POS
            VITE_APP_ICON=/icon.png
            VITE_LOGO=precious_place_logo-removebg.png
            DOMAIN_OR_IP=${{ env.DOMAIN_OR_IP }}
            VITE_GET_PRODUCTS_WEBHOOK=${{ env.API_BASE_URL }}pos/products
            VITE_RECORD_SALES_WEBHOOK=${{ env.API_BASE_URL }}pos/recordSales
            VITE_DAILY_SALES_WEBHOOK=${{ env.API_BASE_URL }}pos/dailyTotalSales

      - name: Build and push Ledger Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./ledger-frontend
          push: true
          tags: ${{ env.IMAGE_NAME_PREFIX }}/ledger_frontend:staging
          build-args: |
            VITE_API_BASE_URL=${{ env.API_BASE_URL }}
            VITE_APP_TITLE=Accounting
            VITE_GET_JOURNAL_ENTRIES_WEBHOOK=${{ env.API_BASE_URL }}accounting/journalEntries
            VITE_GET_ACCOUNTS_WEBHOOK=${{ env.API_BASE_URL }}accounting/accounts
            VITE_GET_GENERAL_LEDGER_WEBHOOK=${{ env.API_BASE_URL }}accounting/ledger
            VITE_GET_TRIAL_BALANCE_WEBHOOK=${{ env.API_BASE_URL }}accounting/trialBalance
            VITE_GET_CATEGORIES_WEBHOOK=${{ env.API_BASE_URL }}accounting/categories
            VITE_GET_BALANCE_SHEET_WEBHOOK=${{ env.API_BASE_URL }}accounting/balanceSheet
            VITE_GET_PROFIT_LOSS_WEBHOOK=${{ env.API_BASE_URL }}accounting/profitAndLoss
            VITE_POST_JOURNAL_ENTRIES_WEBHOOK=${{ env.API_BASE_URL }}accounting/journalEntry
            VITE_CREATE_ACCOUNT_WEBHOOK=${{ env.API_BASE_URL }}accounting/createAccount
            VITE_GET_INCOME_WEBHOOK=${{ env.API_BASE_URL }}accounting/incomeReport
            VITE_GET_EXPENSE_WEBHOOK=${{ env.API_BASE_URL }}accounting/expenseReport

      - name: Build and push Custom Cake Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./custom-cake-order-manager/custom_cake_frontend
          push: true
          tags: ${{ env.IMAGE_NAME_PREFIX }}/custom_cake_frontend:staging
          build-args: |
            VITE_API_BASE_URL=${{ env.API_BASE_URL }}
            VITE_APP_TITLE=Custom Cake
            VITE_IMAGE_BASE_URL=${{ env.IMAGE_BASE_URL }}
            DOMAIN_OR_IP=${{ env.DOMAIN_OR_IP }}

      - name: Build and push Python App
        uses: docker/build-push-action@v5
        with:
          context: ./custom-cake-order-manager/python_app
          push: true
          tags: ${{ env.IMAGE_NAME_PREFIX }}/python_app:staging

      - name: Build and push Custom n8n
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./n8n/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME_PREFIX }}/n8n_custom:staging

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Write .env file
        run: |
          echo '${{ secrets.ENV_JSON }}' \
            | jq -r 'to_entries | map("\(.key)=\(.value)") | .[]' > .env

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config

      - name: Prepare server directories
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} \
            "sudo mkdir -p /app/letsencrypt /app/postgres/postgres-init /app/custom-cake-order-manager/postgres/postgres-init \
             && sudo chown -R ${{ secrets.SERVER_USER }}:${{ secrets.SERVER_USER }} /app"

      - name: Transfer config files
        run: |
          scp docker-compose.yml docker-compose.ghcr.yml .env \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/app/
          scp postgres/postgres-init/*.sh postgres/postgres-init/*.sql \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/app/postgres/postgres-init/
          scp custom-cake-order-manager/postgres/postgres-init/*.sql \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/app/custom-cake-order-manager/postgres/postgres-init/

      - name: Ensure persistent directories
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            sudo mkdir -p /app/n8n/flows
            sudo mkdir -p /app/public/images/products
            sudo mkdir -p /app/public/images/cake-orders/tmp
            sudo mkdir -p /app/public/images/tmp
            sudo chown -R 1000:1000 /app/n8n/flows /app/public
            sudo chmod -R 775 /app/n8n/flows /app/public
          EOF

      - name: Inject ACME certificate
        env:
          ACME_JSON: ${{ secrets.ACME_JSON }}
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} \
            "cat > /app/letsencrypt/acme.json && chmod 600 /app/letsencrypt/acme.json" \
            <<< "$ACME_JSON"

      - name: Deploy with Docker Compose
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << EOF
            cd /app
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            sudo docker compose down --remove-orphans
            sudo docker compose -f docker-compose.yml -f docker-compose.ghcr.yml pull
            sudo docker compose -f docker-compose.yml -f docker-compose.ghcr.yml up -d --remove-orphans
            sudo docker image prune -f
          EOF